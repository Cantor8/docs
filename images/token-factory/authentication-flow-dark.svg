<text x="55" y="891" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">7</text>
