<text x="36" y="93" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="30" font-weight="650" text-anchor="start" letter-spacing="0">Default deployment</text>
<rect x="32" y="132" width="480" height="476" rx="14" fill="#111C35" stroke="#2A3D64"/>
<text x="56" y="168" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" text-anchor="start" letter-spacing="0">Your network</text>
<text x="56" y="193" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Private services and acting parties</text>
<rect x="544" y="132" width="288" height="476" rx="14" fill="#111C35" stroke="#2A3D64"/>
<text x="568" y="168" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" text-anchor="start" letter-spacing="0">Cantor8</text>
<text x="568" y="193" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Registry and observer</text>
<rect x="864" y="132" width="304" height="476" rx="14" fill="#111C35" stroke="#2A3D64"/>
<text x="888" y="168" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" text-anchor="start" letter-spacing="0">Holders</text>
<text x="888" y="193" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Wallets and their participant</text>
