<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1056" viewBox="0 0 1200 1056" data-header="clean" role="img" aria-labelledby="title desc">
<title id="title">Transfer flow</title><desc id="desc">Sender wallet requests Transfer context from Registry public API, which returns Choice context. Sender wallet submits as sender to Sender participant. If Receiver pre-approved, Sender participant returns Receiver holding created to Sender wallet. Otherwise, in the Offer branch, Sender participant returns Offer created to Sender wallet; Receiver participant requests Accept context from Registry public API, then submits as receiver on Receiver participant.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#A7B6E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="1056" rx="20" fill="#0B1124"/>
<g transform="translate(0,-44)">
<text x="36" y="93" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="30" font-weight="650" text-anchor="start" letter-spacing="0">Transfer flow</text>
<rect x="28" y="237" width="1144" height="76" rx="10" fill="#111C35"/>
<rect x="28" y="397" width="1144" height="76" rx="10" fill="#111C35"/>
<rect x="100" y="500" width="1060" height="514" rx="12" fill="#111C35" stroke="#2A3D64"/>
<path d="M100 646 H1160" fill="none" stroke="#2A3D64" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M170 210 V1010" fill="none" stroke="#2A3D64" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M458 210 V1010" fill="none" stroke="#2A3D64" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M746 210 V1010" fill="none" stroke="#2A3D64" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M1034 210 V1010" fill="none" stroke="#2A3D64" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<g id="actor-W">
<rect x="50" y="142" width="240" height="68" rx="10" fill="#1E40CC"/>
<text x="170.0" y="182.0" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0">Sender wallet</text>
</g>
<g id="actor-R">
<rect x="338" y="142" width="240" height="68" rx="10" fill="#182744" stroke="#2A3D64"/>
<text x="458.0" y="182.0" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0">Registry public API</text>
</g>
<g id="actor-S">
<rect x="626" y="142" width="240" height="68" rx="10" fill="#182744" stroke="#2A3D64"/>
<text x="746.0" y="182.0" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0">Sender participant</text>
</g>
<g id="actor-H">
<rect x="914" y="142" width="240" height="68" rx="10" fill="#182744" stroke="#2A3D64"/>
<text x="1034.0" y="182.0" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0">Receiver participant</text>
</g>
<rect x="116" y="508" width="250" height="32" rx="7" fill="#1B2D55"/>
<text x="130" y="530" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" letter-spacing="0">Receiver pre-approved</text>
<rect x="116" y="664" width="250" height="32" rx="7" fill="#1B2D55"/>
<text x="130" y="686" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" letter-spacing="0">Else: Offer</text>
<g id="message-1" data-from="W" data-to="R" data-kind="-&gt;&gt;" data-label="Transfer context" data-branch="common">
<rect x="36" y="265" width="38" height="30" rx="8" fill="#1B2D55"/>
<text x="55" y="285" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">1</text>
<text x="314.0" y="262" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0">Transfer context</text>
<path d="M170 280 H458" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="message-2" data-from="R" data-to="W" data-kind="--&gt;&gt;" data-label="Choice context" data-branch="common">
<rect x="36" y="345" width="38" height="30" rx="8" fill="#1B2D55"/>
<text x="55" y="365" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">2</text>
<text x="314.0" y="342" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0">Choice context</text>
<path d="M458 360 H170" fill="none" stroke="#A7B6E0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#return)"/>
</g>
<g id="message-3" data-from="W" data-to="S" data-kind="-&gt;&gt;" data-label="Submit as sender" data-branch="common">
<rect x="36" y="425" width="38" height="30" rx="8" fill="#1B2D55"/>
<text x="55" y="445" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">3</text>
<text x="458.0" y="422" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0">Submit as sender</text>
<path d="M170 440 H746" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="message-4" data-from="S" data-to="W" data-kind="--&gt;&gt;" data-label="Receiver holding created" data-branch="Receiver pre-approved">
<rect x="36" y="577" width="38" height="30" rx="8" fill="#1B2D55"/>
<text x="55" y="597" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">4a</text>
<text x="458.0" y="574" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0">Receiver holding created</text>
<path d="M746 592 H170" fill="none" stroke="#A7B6E0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#return)"/>
</g>
<g id="message-5" data-from="S" data-to="W" data-kind="--&gt;&gt;" data-label="Offer created" data-branch="Offer">
<rect x="36" y="733" width="38" height="30" rx="8" fill="#1B2D55"/>
<text x="55" y="753" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">4b</text>
<text x="458.0" y="730" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0">Offer created</text>
<path d="M746 748 H170" fill="none" stroke="#A7B6E0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#return)"/>
</g>
<g id="message-6" data-from="H" data-to="R" data-kind="-&gt;&gt;" data-label="Accept context" data-branch="Offer">
<rect x="36" y="821" width="38" height="30" rx="8" fill="#1B2D55"/>
<text x="55" y="841" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">5b</text>
<text x="746.0" y="818" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0">Accept context</text>
<path d="M1034 836 H458" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="message-7" data-from="H" data-to="H" data-kind="-&gt;&gt;" data-label="Submit as receiver" data-branch="Offer">
<rect x="36" y="919" width="38" height="30" rx="8" fill="#1B2D55"/>
<text x="55" y="939" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">6b</text>
<text x="1012" y="954" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="end" letter-spacing="0">Submit as receiver</text>
<path d="M1034 934 H1110 V976 H1034" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<path d="M40 1060 H88" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="100" y="1065" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Request / submission</text>
<path d="M300 1060 H348" fill="none" stroke="#A7B6E0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#return)"/>
<text x="360" y="1065" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Response</text>
</g>
</svg>
