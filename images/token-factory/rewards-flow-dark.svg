<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="596" viewBox="0 0 1200 596" data-header="clean" role="img" aria-labelledby="title desc">
<title id="title">How a marker is produced</title><desc id="desc">Holder activity → Price the traffic → Skip excluded venues → Queue the weight → Post a marker batch → Network pays beneficiaries.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#A7B6E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="596" rx="20" fill="#0B1124"/>
<g transform="translate(0,-44)">
<text x="36" y="93" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="30" font-weight="650" text-anchor="start" letter-spacing="0">How a marker is produced</text>
<g id="edge-1" data-from="tx" data-to="price">
<path d="M356 236 H440" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="edge-2" data-from="price" data-to="skip">
<path d="M760 236 H844" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="edge-3" data-from="skip" data-to="queue">
<path d="M1004 316 V410" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="edge-4" data-from="queue" data-to="post">
<path d="M844 490 H760" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="edge-5" data-from="post" data-to="pay">
<path d="M440 490 H356" fill="none" stroke="#7F9AFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g id="stage-tx" data-label="Holder activity" data-order="1">
<rect x="36" y="156" width="320" height="160" rx="12" fill="#111C35" stroke="#2A3D64"/>
<rect x="56" y="174" width="30" height="28" rx="7" fill="#1B2D55"/>
<text x="71" y="194" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">1</text>
<text x="56" y="234" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" letter-spacing="0">Holder activity</text>
<text x="56" y="272" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Transfers, pre-approved transfers,</text>
<text x="56" y="291" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">and settlements</text>
</g>
<g id="stage-price" data-label="Price the traffic" data-order="2">
<rect x="440" y="156" width="320" height="160" rx="12" fill="#111C35" stroke="#2A3D64"/>
<rect x="460" y="174" width="30" height="28" rx="7" fill="#1B2D55"/>
<text x="475" y="194" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">2</text>
<text x="460" y="234" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" letter-spacing="0">Price the traffic</text>
<text x="460" y="272" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Weight derived from traffic cost</text>
</g>
<g id="stage-skip" data-label="Skip excluded venues" data-order="3">
<rect x="844" y="156" width="320" height="160" rx="12" fill="#111C35" stroke="#2A3D64"/>
<rect x="864" y="174" width="30" height="28" rx="7" fill="#1B2D55"/>
<text x="879" y="194" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">3</text>
<text x="864" y="234" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" letter-spacing="0">Skip excluded venues</text>
<text x="864" y="272" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Excluded submissions earn nothing</text>
</g>
<g id="stage-queue" data-label="Queue the weight" data-order="4">
<rect x="844" y="410" width="320" height="160" rx="12" fill="#111C35" stroke="#2A3D64"/>
<rect x="864" y="428" width="30" height="28" rx="7" fill="#1B2D55"/>
<text x="879" y="448" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">4</text>
<text x="864" y="488" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" letter-spacing="0">Queue the weight</text>
<text x="864" y="526" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Weight waits for a batch</text>
</g>
<g id="stage-post" data-label="Post a marker batch" data-order="5">
<rect x="440" y="410" width="320" height="160" rx="12" fill="#1E40CC"/>
<rect x="460" y="428" width="30" height="28" rx="7" fill="#3555D5"/>
<text x="475" y="448" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">5</text>
<text x="460" y="488" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" letter-spacing="0">Post a marker batch</text>
<text x="460" y="526" fill="#DFE7FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Featured-app party submits</text>
</g>
<g id="stage-pay" data-label="Network pays beneficiaries" data-order="6">
<rect x="36" y="410" width="320" height="160" rx="12" fill="#111C35" stroke="#2A3D64"/>
<rect x="56" y="428" width="30" height="28" rx="7" fill="#1B2D55"/>
<text x="71" y="448" fill="#7F9AFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" letter-spacing="0">6</text>
<text x="56" y="488" fill="#F3F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" letter-spacing="0">Network pays beneficiaries</text>
<text x="56" y="526" fill="#A8B7DA" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Rewards credited to beneficiaries</text>
</g>
</g>
</svg>
